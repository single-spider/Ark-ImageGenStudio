name: Validate Ark Studio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ark-frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  python-syntax:
    name: Python syntax check (no runtime startup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend desktop_v2.py native_bridge

  firefox-bridge:
    name: Firefox bridge checks and unpacked artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node --check extension/firefox/background.js
          node --check extension/firefox/content.js
          node --check extension/firefox/popup.js
          node extension/firefox/test-manifest.cjs
          python native_bridge/test_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: ark-firefox-bridge
          path: |
            extension/firefox/
            native_bridge/
            docs/FIREFOX_LOCAL_BRIDGE.md
          if-no-files-found: error
          retention-days: 30
