name: Ark visual review

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install isolated visual test tooling
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render mock studio
        env:
          ARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/visual-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ark-visual-review
          path: frontend/visual-review/
          if-no-files-found: warn
          retention-days: 14
